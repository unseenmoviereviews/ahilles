<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="description" content="Контрольная работа по логике: гонка Ахиллеса и черепахи.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1C12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ахиллес и черепаха — контрольная по логике</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Serif:wght@400;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Античная керамика: терракота, чёрный лак, слоновая кость, эгейская синь. */
:root{
  --clay:#B5502F; --clay2:#8E3A20; --lak:#22160F; --lak2:#3A281C; --ivory:#F5ECD9; --ivory2:#EADBBE; --sand:#E2C896;
  --sea:#2E5C8A; --olive:#6E7A34; --gold:#E0A526; --ok:#2E8B4E; --bad:#C23A2B; --dim:#7A6650;
  --f-pix:"Press Start 2P",ui-monospace,monospace; --f-doc:"PT Serif",Georgia,serif; --f-ui:"Golos Text",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--lak);color:var(--lak);font:16px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.pix{font-family:var(--f-pix);letter-spacing:.02em}
.meander{height:10px;background:
  linear-gradient(90deg,var(--ivory) 0 2px,transparent 2px 10px) 0 0/10px 10px,
  linear-gradient(var(--ivory) 0 2px,transparent 2px) 0 0/10px 10px,var(--lak);opacity:.9}

/* ---------- старт ---------- */
.screen{min-height:100vh;min-height:100dvh;background:var(--ivory);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{position:relative;height:290px;background:var(--lak);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
.hero-t{position:absolute;left:0;right:0;top:0;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(34,22,15,.88),rgba(34,22,15,0));color:var(--ivory);padding-bottom:30px}
.hero-t h1{font:400 19px/1.35 var(--f-pix);margin:0 0 6px;color:var(--gold);text-shadow:2px 2px 0 var(--lak)}
.hero-t p{margin:0;font-size:13.5px;color:#EADBBE}
.card{background:#FFFBF2;border:2px solid var(--lak);box-shadow:4px 4px 0 var(--lak);padding:14px;margin:14px 0}
.card h2{font:700 19px/1.25 var(--f-doc);margin:0 0 8px}
.kick{font:9px/1.5 var(--f-pix);color:var(--clay);text-transform:uppercase;margin:0 0 8px}
.rules{margin:0;padding-left:18px;font-size:14px}
.rules li{margin:0 0 5px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;min-height:48px;padding:12px;border:2px solid var(--lak);background:#fff;font-size:16px;border-radius:0;-webkit-appearance:none}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin:4px 0;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;background:var(--clay);color:#fff;border:2px solid var(--lak);
  box-shadow:0 4px 0 var(--lak);font:400 12px/1.4 var(--f-pix);padding:12px 14px;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lak)}
.btn.sec{background:#FFFBF2;color:var(--lak)}
.btn[disabled]{opacity:.5}
.small{font-size:13px;color:var(--dim)}

/* ---------- облик ---------- */
.look-prev{height:170px;background:linear-gradient(#BFD9E8,#F3E6C8);border:2px solid var(--lak);position:relative;margin-bottom:10px}
.look-prev canvas{width:100%;height:100%}
.heads{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.heads button{aspect-ratio:1;border:2px solid var(--ivory2);background:#fff;padding:3px;display:flex;align-items:center;justify-content:center}
.heads img{max-width:100%;max-height:100%;image-rendering:auto}
.heads button[aria-pressed="true"]{border-color:var(--clay);box-shadow:0 0 0 2px var(--clay)}
.cols{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cols button{width:44px;height:44px;border:2px solid var(--lak)}
.cols button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold)}

/* ---------- игра: 2/3 тест, 1/3 гонка ---------- */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ivory)}
.quiz{flex:2 1 0;min-height:0;display:flex;flex-direction:column}
.qtop{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--lak);color:var(--ivory);
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.qtop .ttl{font:9px/1.3 var(--f-pix);color:var(--gold)}
.qtop .meta{display:flex;gap:8px;align-items:center;font:12px/1 var(--f-ui);white-space:nowrap}
.qbar{height:6px;background:var(--lak2)}
.qbar i{display:block;height:100%;background:var(--gold)}
.qbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 14px}
.qbody .wrap{padding:0}
.topic{font:8px/1.5 var(--f-pix);color:var(--clay);text-transform:uppercase;margin:0 0 6px}
.qtext{font:700 18px/1.35 var(--f-doc);margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;min-height:50px;background:#FFFBF2;
  border:2px solid var(--lak);box-shadow:3px 3px 0 var(--lak);font-size:15px;line-height:1.35}
.opt b{flex:0 0 auto;font:400 10px/1.9 var(--f-pix);color:var(--clay)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--lak)}
.opt.ok{background:#DDF1E2;border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.opt.bad{background:#F8DCD7;border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.opt[disabled]{cursor:default}
.flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);font:400 18px/1 var(--f-pix);padding:12px 16px;
  background:var(--lak);color:#fff;border:2px solid #fff;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50}
.flash.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.flash.ok{color:#8EF0A8} .flash.bad{color:#FF9B8E}
.race{flex:1 1 0;min-height:0;position:relative;background:#BFD9E8;border-top:3px solid var(--lak);padding-bottom:env(safe-area-inset-bottom)}
.race canvas{position:absolute;left:0;top:0;width:100%;height:calc(100% - env(safe-area-inset-bottom))}
.rhud{position:absolute;left:8px;right:8px;top:6px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;
  font:8px/1.4 var(--f-pix);color:var(--lak)}
.rhud span{background:rgba(255,251,242,.88);border:2px solid var(--lak);padding:4px 6px}
.res{text-align:center;padding:4px 0 10px}
.res .grade{font:400 52px/1 var(--f-pix);color:var(--clay);margin:6px 0 8px;text-shadow:3px 3px 0 var(--lak)}
.res .gw{font:9px/1.4 var(--f-pix);color:var(--dim)}
.res p{margin:8px 0}
.gcard{color:#fff}
.rv{border-top:1px solid var(--ivory2);padding:10px 0;font-size:14px}
.rv .k{font:8px/1.6 var(--f-pix);color:var(--ok)} .rv.no .k{color:var(--bad)}
.rv q{display:block;quotes:none;margin:3px 0;color:#4B3A2C}
.rv .why{color:var(--dim);font-size:13px;margin:4px 0 0}

/* ---------- проектор ---------- */
.proj{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--lak);color:var(--ivory)}
.proj .race{flex:3 1 0;border-top:0}
.board{flex:2 1 0;min-height:0;overflow:auto;padding:10px 16px;columns:3 220px;column-gap:24px;font-size:15px}
.board div{break-inside:avoid;display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid #4A3626;padding:5px 0}
.board b{font:10px/1.8 var(--f-pix);color:var(--gold);min-width:36px}
.board .fin{color:#8EF0A8}
.opt.gone{opacity:.45;box-shadow:none;border-style:dashed}
.ticker{max-height:0;overflow:hidden;background:var(--sea);color:#fff;font-size:13.5px;line-height:1.35;padding:0 12px;transition:max-height .25s,padding .25s}
.ticker.on{max-height:60px;padding:7px 12px}
.dock{flex:0 0 auto;background:var(--ivory);border-top:2px solid var(--lak);padding:7px 12px 8px}
.item{margin:0}
.item.empty{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:2px 0}
.item .ic{font-size:24px;line-height:1}
.use{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--gold);border:2px solid var(--lak);box-shadow:3px 3px 0 var(--lak);padding:7px 10px;min-height:52px;line-height:1.25;animation:pulse 1.2s ease-in-out infinite}
.use small{font-size:12px;color:#3B2A12}
.use .go{margin-left:auto;font:9px/1 var(--f-pix);background:var(--lak);color:var(--gold);padding:8px 8px}
@keyframes pulse{50%{transform:translateY(-2px)}}
.streak{display:inline-flex;gap:4px;vertical-align:middle}
.streak i{width:12px;height:12px;border:2px solid var(--lak);background:#fff}
.streak i.on{background:var(--gold)}
.sts{display:block;font-size:12px;color:var(--dim);margin-top:4px;margin-left:auto}
.item.empty .sts{margin-top:0}
.item .ic{font-size:20px}
.use b{font-size:14px}
@media (max-height:720px){.use small{display:none}.use{min-height:44px;padding:5px 10px}.dock{padding:5px 12px 6px}}

@media (max-height:640px){.qtext{font-size:16.5px}.opt{font-size:14px;padding:9px 10px;min-height:44px}}

/* ---------- визуальная новелла ---------- */
.vn{position:fixed;inset:0;overflow:hidden;background:var(--lak);user-select:none;-webkit-user-select:none}
.vn #vbg{position:absolute;inset:0;width:100%;height:100%}
.vtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:6;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:linear-gradient(rgba(34,22,15,.75),rgba(34,22,15,0));color:var(--ivory);font:8px/1.5 var(--f-pix)}
.vtop #vChap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtr{display:flex;align-items:center;gap:6px}
.vtr button{width:38px;height:38px;font-size:18px;background:rgba(255,251,242,.92);border:2px solid var(--lak);color:var(--lak)}
.vwis{background:var(--gold);color:var(--lak);border:2px solid var(--lak);padding:6px 6px;white-space:nowrap}
.vwis.pop{animation:vpop .5s}
@keyframes vpop{40%{transform:scale(1.25)}}
.slot{position:absolute;bottom:calc(158px + env(safe-area-inset-bottom));z-index:2;transition:filter .25s,transform .25s,opacity .3s;pointer-events:none}
.slot canvas{display:block;height:min(44vh,360px);width:auto;image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(34,22,15,.35))}
.slot.l{left:-4%} .slot.r{right:-4%} .slot.c{left:50%;transform:translateX(-50%)}
.slot.dim{filter:brightness(.55) saturate(.7)}
.slot.talk{transform:translateY(-6px)} .slot.c.talk{transform:translate(-50%,-6px)}
.slot.enter canvas{animation:vin .35s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(16px)}}
.slot.walk canvas{animation:vwalk 1.6s ease-in-out}
@keyframes vwalk{30%{transform:translateX(18vw)}70%{transform:translateX(-12vw)}}
.vbox{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:4;min-height:142px;overflow:visible;
  background:#FFFBF2;border:3px solid var(--lak);box-shadow:4px 4px 0 var(--lak);padding:22px 14px 26px;max-width:760px;margin:0 auto}
.vbox.narr{background:#F1E6CF;font-style:italic}
.vbox.ask{background:var(--lak);color:var(--ivory);font-weight:600}
.vname{position:absolute;left:10px;top:-15px;z-index:1;background:var(--clay);color:#fff;border:2px solid var(--lak);font:9px/1 var(--f-pix);padding:7px 9px}
.vtext{font:17px/1.5 var(--f-doc);white-space:pre-wrap;max-height:calc(46vh - 50px);overflow:auto}
.vmore{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--clay);animation:vblink 1s steps(2) infinite}
@keyframes vblink{50%{opacity:0}}
.vchoices{position:absolute;left:8px;right:8px;z-index:5;bottom:calc(160px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;max-width:760px;margin:0 auto;
  max-height:calc(100% - 230px);overflow:auto;padding:4px}
.vchoices.on{display:flex}
.vopt{text-align:left;background:#FFFBF2;border:2px solid var(--lak);box-shadow:3px 3px 0 var(--lak);padding:11px 12px;font-size:15px;line-height:1.35;animation:vin .3s ease-out both}
.vopt:nth-child(2){animation-delay:.06s}.vopt:nth-child(3){animation-delay:.12s}.vopt:nth-child(4){animation-delay:.18s}
.vopt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--lak);background:var(--sand)}
.vtitle{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;
  background:rgba(34,22,15,.92);color:var(--ivory);opacity:0;pointer-events:none;transition:opacity .5s}
.vtitle.on{opacity:1;pointer-events:auto}
.vtitle span{font:10px/1.6 var(--f-pix);color:var(--gold)} .vtitle b{font:400 22px/1.35 var(--f-doc)}
.vlog{position:absolute;inset:0;z-index:9;display:none;overflow:auto;background:rgba(245,236,217,.98);padding:calc(14px + env(safe-area-inset-top)) 14px 30px}
.vlog.on{display:block}
.vlog-in{max-width:620px;margin:0 auto}
.lg{margin:6px 0;font:15px/1.45 var(--f-doc)} .lg b{font:8px/1.6 var(--f-pix);color:var(--clay);margin-right:4px}
.big-res{font:400 26px/1.2 var(--f-pix);margin:10px 0;text-shadow:2px 2px 0 var(--lak)} .big-res.ok{color:var(--ok)} .big-res.no{color:var(--bad)}
.wreath{font-size:56px;text-align:center;margin:6px 0}
@media (max-height:700px){.slot canvas{height:38vh}.vtext{font-size:15.5px}.vbox{min-height:120px;padding:20px 12px 22px}.slot{bottom:calc(134px + env(safe-area-inset-bottom))}.vchoices{bottom:calc(136px + env(safe-area-inset-bottom))}.vopt{font-size:14px;padding:9px 10px}}
@media (min-width:900px){.slot.l{left:8%}.slot.r{right:8%}}
.proj .closebar{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:6px}
.proj .closebar input{width:130px;padding:8px;border:2px solid var(--lak)}
.proj .closebar button{background:var(--gold);color:var(--lak);border:2px solid var(--lak);font:9px/1 var(--f-pix);padding:10px}
.podium{position:fixed;inset:0;z-index:20;background:rgba(34,22,15,.94);color:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.podium h2{font:400 20px/1.4 var(--f-pix);color:var(--gold);margin:0}
.podium p{font:22px/1.4 var(--f-doc);margin:0}
</style>
</head>

/* ---------- демо: та же логика сервера, но в памяти, плюс 11 ботов ---------- */
var FK = { pl: {}, ev: [], id: 0 };
function fakeEv(room, from, fromName, to, toName, kind, step) {
  var e = { id: ++FK.id, room: room, from: from, fromName: fromName, to: to, toName: toName, kind: kind, step: step, used: "" };
  FK.ev.push(e); return e;
}
function fake(p) {
  var room = String(p.room || "");
  if (p.a === "upd") {
    FK.pl[p.id] = { id: p.id, room: room, name: p.name, look: p.look, pos: +p.pos, n: +p.n, fin: +p.fin, t: Date.now() };
    JSON.parse(p.ev || "[]").forEach(function (e) {
      fakeEv(room, p.id, p.name, e.to, e.toName, e.kind, e.step);
      var b = FK.pl[e.to]; if (b && b.bot) botHit(b, ITEMS[e.kind].atk);
    });
    JSON.parse(p.used || "[]").forEach(function (id) { FK.ev.forEach(function (e) { if (e.id === id) e.used = p.name; }); });
    return { ok: true };
  }
  if (p.a === "state") {
    var since = +p.since || 0;
    return { ok: true,
      p: Object.keys(FK.pl).map(function (k) { var b = FK.pl[k]; return [b.id, b.name, b.look, b.pos, b.n, b.fin ? 1 : 0]; }).filter(function (r) { return FK.pl[r[0]].room === room || FK.pl[r[0]].bot; }),
      e: FK.ev.filter(function (e) { return e.id > since && e.kind !== "trap"; }).map(function (e) { return [e.id, e.from, e.fromName, e.to, e.toName, e.kind, e.step]; }),
      tr: FK.ev.filter(function (e) { return e.kind === "trap" && !e.used; }).map(function (e) { return [e.id, e.from, e.step]; }) };
  }
  return { ok: true };
}
function botLeader() {
  var arr = Object.keys(FK.pl).map(function (k) { return FK.pl[k]; }).filter(function (b) { return !b.fin; }).sort(function (a, b) { return b.pos - a.pos; });
  return arr;
}
function botHit(b, amt) {
  if (b.fin) return;
  if (b.shield) { b.shield = false; return; }
  var arr = botLeader(), lead = arr.length > 1 && arr[0].id === b.id && arr[0].pos > arr[1].pos;
  b.pos = Math.max(0, b.pos - amt * (lead ? 2 : 1));
}
function startBots() {
  var names = ["Агафонова", "Бекетов", "Волкова", "Гаранин", "Дьячкова", "Ермаков", "Жукова", "Зотов", "Ильина", "Карпов", "Лаптева"];
  names.forEach(function (n, i) {
    FK.pl["bot" + i] = { id: "bot" + i, bot: true, name: n + " А.", look: lookKey(i % 9, i % 6), pos: 0, n: 0, fin: 0, streak: 0,
      acc: 0.55 + (i % 5) * 0.09, next: Date.now() + 2000 + i * 700 };
  });
  setInterval(function () {
    var now = Date.now();
    Object.keys(FK.pl).forEach(function (k) {
      var b = FK.pl[k]; if (!b.bot || b.fin || now < b.next) return;
      b.n++; b.next = now + 3500 + Math.random() * 6000;
      if (Math.random() < b.acc) {
        b.pos = Math.min(TRACK, b.pos + (b.boost ? 2 : 1)); b.boost = false; b.streak++;
        FK.ev.forEach(function (e) { if (e.kind === "trap" && !e.used && e.from !== b.id && e.step === b.pos) { e.used = b.name; botHit(b, 1); } });
      } else { b.pos = Math.max(0, b.pos - 1); b.streak = 0; }
      if (b.n >= TRACK) b.fin = 1;
      if (b.streak >= STREAK) {
        b.streak = 0;
        var arr = botLeader(), rank = arr.length > 1 ? arr.indexOf(b) / (arr.length - 1) : 0.5, it = rollItem(rank);
        var ahead = arr.filter(function (x) { return x.pos > b.pos; });
        if (it === "sandals") b.boost = true;
        else if (it === "shield") b.shield = true;
        else if (it === "trap") fakeEv("", b.id, b.name, "", "", "trap", b.pos);
        else if (it === "oil" && ahead.length) { var t = ahead[ahead.length - 1]; fakeEv("", b.id, b.name, t.id, t.name, "oil", 0); if (t.bot) botHit(t, 1); }
        else if (it === "tortoise" && arr.length && arr[0] !== b) { fakeEv("", b.id, b.name, arr[0].id, arr[0].name, "tortoise", 0); if (arr[0].bot) botHit(arr[0], 2); }
        else if (it === "zeus") ahead.forEach(function (t) { fakeEv("", b.id, b.name, t.id, t.name, "zeus", 0); if (t.bot) botHit(t, 1); });
      }

}

function useItem() {
  if (!S || !S.inv || S.done) return;
  var it = S.inv, me = S.pos, msg = "";
  var opp = others(), ahead = opp.filter(function (p) { return p.pos > me; }).sort(function (a, b) { return a.pos - b.pos; });
  function hit(p, kind) { S.out.push({ to: p.id, toName: p.name, kind: kind, step: 0 }); if (race && race.players[p.id]) race.players[p.id].fx = { icon: ITEMS[kind].icon, until: performance.now() + 1800 }; }
  if (it === "oil") { if (!ahead.length) return note("Впереди никого нет. Масло пригодится позже."); hit(ahead[0], "oil"); msg = "Масло под ногами у " + shortName(ahead[0].name); }
  else if (it === "tortoise") {
    var lead = opp.slice().sort(function (a, b) { return b.pos - a.pos; })[0];
    if (!lead || lead.pos <= me) return note("Вы и так впереди всех. Черепаху лучше приберечь.");
    hit(lead, "tortoise"); msg = "Черепаха Зенона летит в " + shortName(lead.name);
  }
  else if (it === "zeus") { if (!ahead.length) return note("Впереди никого нет — Зевсу не в кого метать."); ahead.forEach(function (p) { hit(p, "zeus"); }); msg = "Гнев Зевса: " + ahead.length + " бегун(ов) впереди теряют шаг"; }
  else if (it === "trap") { S.out.push({ to: "", toName: "", kind: "trap", step: me }); S.myTraps = (S.myTraps || []).concat(me); msg = "Амфора с маслом стоит на шаге " + me; }
  else if (it === "sandals") { S.boost = true; msg = "Сандалии надеты: следующий верный ответ — +2 шага"; }
  else if (it === "owl") {
    var q = curQ(); S.owl = S.owl || {};
    S.owl[q.id] = shuffle([1, 2, 3]).slice(0, 2); msg = "Сова Афины убрала два неверных варианта";

  clearTimeout(ui.noteT); ui.noteT = setTimeout(function () { var e2 = document.getElementById("ticker"); if (e2) e2.className = "ticker"; }, 4200);
}
function takeHit(kind, fromName, amt) {

  var k = amLeader() ? 2 : 1, d = amt * k;

  note(ITEMS[kind].icon + " " + ITEMS[kind].name + " от " + shortName(fromName) + ": −" + d + (k > 1 ? " (ахиллесова пята лидера)" : ""));
  dirty = true; save(); hud();
}
function checkTrap() {

  } else {
    var G = grade(S.pos, TRACK);
    gFinish(WORK, Math.min(S.pos, TRACK), TRACK);
    if (!S.finSent && RACE_URL && !net.finSending) {

        '<label class="field"><span>Пароль преподавателя на разбор</span><input id="pw" type="password" autocomplete="off"></label><p class="err">' + esc(ui.pwErr) + '</p>' +

function itemBar() {
  var st = [];
  if (S.shield) st.push("🛡️ щит");
  if (S.boost) st.push("👟 +2");
  if (amLeader()) st.push("🦶 лидер: удары ×2");
  var streak = '<span class="streak">' + [0, 1, 2].map(function (k) { return '<i class="' + (k < S.streak ? "on" : "") + '"></i>'; }).join("") + '</span>';
  if (S.inv) {
    var it = ITEMS[S.inv];
    return '<div class="item"><button class="use" data-act="use"><span class="ic">' + it.icon + '</span><span><b>' + esc(it.name) + '</b><br><small>' + esc(it.hint) + '</small></span><span class="go">ПУСК</span></button>' + (st.length ? '<span class="sts">' + st.join(" · ") + '</span>' : '') +
      '</div>';
  }
  return '<div class="item empty"><span class="ic">🏺</span>' + streak + '<span class="small">до подлянки</span>' +
    (st.length ? '<span class="sts">' + st.join(" · ") + '</span>' : '') + '</div>';
}

function review() {
  var h = '<p class="kick" style="margin-top:14px">Разбор</p>';
  S.ans.forEach(function (a, k) {
    var q = QUESTIONS.filter(function (x) { return x.id === a.qid; })[0];
    h += '<div class="rv' + (a.ok ? "" : " no") + '"><span class="k">' + (k + 1) + ' · ' + (a.ok ? "верно" : "неверно") + ' · тема ' + q.t + '</span><q>' + esc(q.q) + '</q>' +
      (a.ok ? "" : '<q>Ваш ответ: ' + esc(q.o[a.o]) + '</q>') + '<q><b>Верно: ' + esc(q.o[0]) + '</b></q><p class="why">' + esc(q.why) + '</p></div>';
  });
  return h;
}

function answer(o) {
  if (ui.lock || S.done) return;
  ui.lock = true;
  var q = curQ(), ok = o === 0, gain = 0;
  var b = document.getElementById("opt" + o); if (b) b.classList.add(ok ? "ok" : "bad");
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (x) { x.disabled = true; });
  if (ok) { gain = S.boost ? 2 : 1; S.boost = false; S.ok++; S.streak++; }
  else { gain = -1; S.streak = 0; }
  S.pos = Math.max(0, Math.min(TRACK, S.pos + gain));
  S.ans.push({ qid: q.id, o: o, ok: ok });
  S.i++;
  var trapped = ok && checkTrap();
  S.pend.push({ ts: Date.now(), qid: q.id, topic: q.t, q: q.q, ans: q.o[o], ok: ok ? 1 : 0, pos: S.pos });
  var got = null;
  if (S.streak >= STREAK) { S.streak = 0; if (!S.inv) { S.inv = rollItem(myRank()); got = S.inv; } }
  if (S.i >= TRACK) { S.done = true; S.doneAt = Date.now(); S.inv = null; }
  dirty = true; save();
  flashMsg(ok ? (gain > 1 ? "+2 ШАГА" : "+1 ШАГ") : (S.pos === 0 ? "СТОП" : "−1 ШАГ"), ok && !trapped);
  if (got) setTimeout(function () { note("Серия из " + STREAK + " верных! В амфоре: " + ITEMS[got].icon + " " + ITEMS[got].name); }, 300);
  if (race) race.set(S.id, { name: S.name, look: S.look, pos: S.pos, n: S.i, fin: S.done });
  push();
  setTimeout(function () { ui.lock = false; renderQuiz(); var qb = document.getElementById("qbody"); if (qb) qb.scrollTop = 0; }, 850);
}
function flashMsg(t, ok) {
  var f = document.getElementById("flash");
  f.textContent = t; f.className = "flash on " + (ok ? "ok" : "bad");
  clearTimeout(f.t); f.t = setTimeout(function () { f.className = "flash"; }, 650);
}

function applyList(j) {
  if (!race || !j) return;
  var seen = {};
  (j.p || []).forEach(function (r) {
    if (r[0] === (S && S.id)) return;
    seen[r[0]] = 1;
    race.set(r[0], { name: r[1], look: r[2], pos: +r[3] || 0, n: +r[4] || 0, fin: !!r[5] });
  });
  Object.keys(race.players).forEach(function (id) { if (id !== race.selfId && !seen[id]) delete race.players[id]; });
  applyEvents(j);
  if (j.cl && !net.cl) { net.cl = j.cl; if (S && S.done) renderQuiz(); }
  else if (j.cl) net.cl = j.cl;
  if (PROJ && j.cl) showPodium(j.cl);
  hud();
}
function startPolling() {
  clearInterval(pollT);
  var room = S ? S.room : (QP.zabeg || "").toUpperCase();
  function tick() {
    if (RACE_URL || DEMO) poll(room, function (j) { if (j) applyList(j); });
    if (S) push();
    if (PROJ) renderBoard();
  }
  tick(); pollT = setInterval(tick, DEMO ? 1000 : POLL_MS);
}

  if (k === "@music") { startMusic(); return vnNext(); }
  if (k === "@sfx") { sfx(l[1]); return vnNext(); }
  if (k === "@show") { for (var x in V.stage) if (V.stage[x] === l[2]) delete V.stage[x]; V.stage[l[1]] = l[2]; renderStage(null); return vnNext(); }
  if (k === "@hide") { delete V.stage[l[1]]; renderStage(null); return vnNext(); }
  if (k === "@show_tortoise") { V.tort = l[1]; drawBg(); return vnNext(); }
  if (k === "@walk") { var sl = document.getElementById("slot-" + V.stage[l[1]]); if (sl) { sl.classList.add("walk"); setTimeout(function () { sl.classList.remove("walk"); }, 1600); } return vnNext(); }
  if (k === "@title") return titleCard(l[1], l[2]);
  if (k === "@ending") return startEnding();
  if (k === "@final") return finalScreen();
  if (k === "?") return showChoice(l);
  say(k, fmt(l[1]));
}
function titleCard(a, b) {
  vn.busy = true; sfx("gong");
  var el = document.getElementById("vTitle");
  el.innerHTML = '<span>' + esc(a) + '</span><b>' + esc(b) + '</b>'; el.className = "vtitle on";
  V.chapter = a + " · " + b; var ch = document.getElementById("vChap"); if (ch) ch.textContent = V.chapter;
  setTimeout(function () { el.className = "vtitle"; vn.busy = false; vnNext(); }, 2300);
}
function say(who, text) {
  var box = document.getElementById("vBox"), nm = document.getElementById("vName"), tx = document.getElementById("vText");
  var isN = who === "n", c = CAST[who] || {};
  var name = isN ? "" : who === "me" ? heroName() : c.name;
  nm.textContent = name; nm.style.display = name ? "" : "none";
  box.className = "vbox" + (isN ? " narr" : "");
  renderStage(isN ? null : who);
  V.log.push([name, text]); if (V.log.length > 400) V.log.shift();
  vn.full = text; vn.shown = 0; vn.typing = true; vn.pitch = isN ? 0 : (who === "me" ? 520 : c.pitch);
  tx.textContent = ""; document.getElementById("vMore").style.visibility = "hidden";
  clearInterval(vn.typeT);
  vn.typeT = setInterval(function () {
    vn.shown += 1; tx.textContent = vn.full.slice(0, vn.shown);
    if (vn.pitch && vn.shown % 2 === 0 && /[а-яёa-z]/i.test(vn.full.charAt(vn.shown - 1))) blip(vn.pitch);
    if (vn.shown >= vn.full.length) finishType();
  }, 28);
}
function finishType() {
  clearInterval(vn.typeT); vn.typing = false;
  var tx = document.getElementById("vText"); if (tx) tx.textContent = vn.full;
  var m = document.getElementById("vMore"); if (m) m.style.visibility = "visible";
}
function showChoice(l) {
  vn.busy = true;
  var key = l[1], box = document.getElementById("vChoices");
  var order = V.ord && V.ord[key] ? V.ord[key] : shuffle(l[3].map(function (o, i) { return i; }));
  V.ord = V.ord || {}; V.ord[key] = order; vSave();
  document.getElementById("vName").style.display = "none";
  document.getElementById("vBox").className = "vbox ask";
  document.getElementById("vText").textContent = l[2];
  document.getElementById("vMore").style.visibility = "hidden";
  renderStage(null);
  box.innerHTML = order.map(function (i) { return '<button class="vopt" data-vo="' + i + '">' + esc(l[3][i][0]) + '</button>'; }).join("");
  box.className = "vchoices on";
  box.onclick = function (e) {
    var b = e.target.closest("[data-vo]"); if (!b) return;
    e.stopPropagation();
    var o = l[3][+b.dataset.vo];
    sfx("pick"); setTimeout(function () { sfx(o[1] === 2 ? "ok" : "bad"); }, 120);
    V.W += o[1]; V.ch[key] = { o: o[0], w: o[1] };
    if (o[3]) V.flags[o[3]] = (V.flags[o[3]] || 0) + 1;
    V.log.push(["Ваш выбор", o[0]]);
    vn.Q = o[2].slice(); V.qsave = vn.Q.slice();
    box.className = "vchoices"; box.innerHTML = ""; vn.busy = false; vSave();
    updWisdom(o[1]);
    vnNext();
  };
}
function updWisdom(w) {
  var el = document.getElementById("vWis"); if (!el) return;
  el.textContent = "мудрость " + V.W;
  if (w === 2) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
}
function courtScore() {
  var n = 0; ["c5_1", "c5_5", "c5_6", "c5_7", "c5_8", "c5_9"].forEach(function (k) { if (V.ch[k] && V.ch[k].w === 2) n++; });
  return n;
}
function pickEnding() {
  var pct = V.W / VMAX, pass = pct >= 0.6, court = courtScore() >= 4;
  if (pass && pct >= 0.85 && court) return "student";
  if (pass && (V.flags.soph || 0) >= 2) return "sophist";
  if (pass) return "citizen";
  if (!court) return "exile";
  return "barrel";
}
function startEnding() {
  var k = pickEnding(), E = ENDINGS[k];
  V.endKey = k; V.stage = {}; renderStage(null);
  vn.Q = [["@bg", E.bg], ["@amb", E.amb], ["@title", "Концовка", E.title]].concat(E.lines, [["@final"]]);
  vnNext();
}
function finalScreen() {
  var E = ENDINGS[V.endKey], pct = Math.round(V.W / VMAX * 100);
  V.ended = { key: V.endKey, title: E.title, pass: E.pass, pct: pct, at: Date.now() }; vSave();
  vnSend();
  renderVN();
}
function vnSend() {
  if (!V.ended || V.sent || DEMO || !RACE_URL) return;
  var ch = Object.keys(V.ch).map(function (k) { return k + ":" + V.ch[k].w; }).join(" ");
  api({ a: "vn", room: V.room, name: V.name, group: V.group, ending: V.ended.title, pass: V.ended.pass ? 1 : 0, w: V.W, max: VMAX, pct: V.ended.pct,
    min: Math.max(1, Math.round((V.ended.at - V.startedAt) / 60000)), lv: V.lv || 0, tries: V.tries || 1, soph: V.flags.soph || 0, court: courtScore(), ch: ch }, function (j) {
    if (j && j.ok) { V.sent = true; vSave(); var s = document.getElementById("vSent"); if (s) s.textContent = "Результат записан в ведомость ✓"; }
    else { var s2 = document.getElementById("vSent"); if (s2) s2.textContent = "Не удалось отправить. Проверьте интернет и нажмите «Отправить ещё раз»."; }
  });
}

/* ---------- экран новеллы ---------- */
function renderVN() {
  stopGame(); document.body.classList.add("bare");
  if (V.ended) {
    var E = V.ended;
    app.innerHTML = '<div class="screen vend"><div class="hero" style="height:230px"><canvas id="heroCv"></canvas><div class="hero-t"><h1>' + esc(E.title) + '</h1><p>' +
      (E.pass ? "Зачёт" : "Незачёт") + ' · мудрость ' + V.W + ' из ' + VMAX + ' (' + E.pct + '%)</p></div></div><div class="meander"></div><main class="wrap">' +
      '<div class="card"><p class="kick">' + (DEMO ? "Тренировка" : "Ведомость") + '</p><h2>' + esc(V.name) + (V.group ? ", " + esc(V.group) : "") + '</h2>' +
      '<p class="big-res ' + (E.pass ? "ok" : "no") + '">' + (E.pass ? "ЗАЧЁТ" : "НЕЗАЧЁТ") + '</p>' +
      '<p class="small" id="vSent">' + (DEMO ? "Тренировка: результат никуда не отправляется." : V.sent ? "Результат записан в ведомость ✓" : "Отправляем результат…") + '</p>' +
      (!DEMO && !V.sent ? '<button class="btn sec" data-act="vsend">Отправить ещё раз</button>' : '') +
      (!E.pass || DEMO ? '<button class="btn" data-act="vagain">Пройти путь ещё раз</button>' : '') +
      '<button class="btn sec" data-act="vlog">Перечитать путь</button></div></main></div>';
    var cv = document.getElementById("heroCv"); var r2 = new Race(cv, { nolabel: true }); r2.selfId = "x";
    r2.set("me", { name: "", look: V.look, pos: 0, n: 0, fin: E.pass }); heroRace = r2;
    if (!V.sent) vnSend();
    return;
  }
  app.innerHTML =
    '<div class="vn" id="vn"><canvas id="vbg"></canvas>' +
    '<div class="vtop"><span id="vChap">' + esc(V.chapter || "") + '</span><span class="vtr"><span id="vWis" class="vwis">мудрость ' + V.W + '</span>' +
      '<button id="vLogB" data-act="vlog" aria-label="Журнал">📜</button><button id="vMute" data-act="vmute" aria-label="Звук">' + (vn.mute ? "🔇" : "🔊") + '</button></span></div>' +
    '<div class="slot l" id="slot-l"></div><div class="slot c" id="slot-c"></div><div class="slot r" id="slot-r"></div>' +
    '<div class="vbox" id="vBox"><div class="vname" id="vName"></div><div class="vtext" id="vText"></div><div class="vmore" id="vMore">▼</div></div>' +
    '<div class="vchoices" id="vChoices"></div><div class="vtitle" id="vTitle"></div><div class="vlog" id="vLog"></div></div>';
  drawBg(); setAmb(V.amb); renderStage(null);
  document.getElementById("vn").addEventListener("click", function (e) {
    if (e.target.closest("button,.vlog.on")) return;
    vnNext();
  });
  // продолжение с места остановки
  vn.Q = (V.qsave || []).slice();
  if (V.ip === 0 && !vn.Q.length) vnNext();
  else {
    // повторить последнюю реплику, чтобы было что читать
    var last = V.log[V.log.length - 1];
    var back = SCRIPT[V.ip - 1];
    if (back && back[0] === "?" && !V.ch[back[1]]) { V.ip--; vnNext(); }
    else if (last) { document.getElementById("vName").textContent = last[0]; document.getElementById("vName").style.display = last[0] ? "" : "none"; document.getElementById("vText").textContent = last[1]; }
    else vnNext();
  }
}
window.addEventListener("resize", function () { if (document.getElementById("vbg")) drawBg(); });
function openLog() {
  var el = document.getElementById("vLog");
  if (!el) { // экран итога: перечитать путь
    app.innerHTML = '<div class="screen"><main class="wrap"><div class="card"><p class="kick">Путь</p>' +
      V.log.map(function (r) { return '<p class="lg"><b>' + esc(r[0] || "") + '</b> ' + esc(r[1]) + '</p>'; }).join("") +
      '<button class="btn" data-act="vback">Назад</button></div></main></div>';
    return;
  }
  el.innerHTML = '<div class="vlog-in"><p class="kick">Журнал</p>' + V.log.slice(-60).map(function (r) { return '<p class="lg"><b>' + esc(r[0] || "") + '</b> ' + esc(r[1]) + '</p>'; }).join("") +
    '<button class="btn" data-act="vlogclose">Закрыть</button></div>';
  el.className = "vlog on"; el.scrollTop = el.scrollHeight;
}

function startVN(who) {
  V = vLoad();
  if (!V || V.name !== who.name) { V = vFresh(who); vSave(); }
  ac(); if (vn.ac && vn.ac.state === "suspended") vn.ac.resume();
  renderVN();
}

/* ---------- зачёт после забега ---------- */
function vnWho() {
  if (S) return { name: S.name, surname: S.surname, first: S.name.slice((S.surname || "").length).trim(), group: S.group, room: S.room, look: S.look };
  return { name: (draft.sur.trim() + " " + draft.name.trim()).trim(), surname: draft.sur.trim(), first: draft.name.trim(), group: draft.group.trim(),
    room: (draft.room || draft.group).trim().toUpperCase(), look: lookKey(draft.h, draft.c) };
}
function amExempt() { return !!(net.cl && S && net.cl.some(function (r) { return r[0] === S.id; })); }
function zachetCard() {
  if (DEMO) return '<div class="card"><p class="kick">Зачёт</p><p class="small" style="margin:0">После настоящего забега трое первых освобождаются от зачёта, остальные проходят «Одиссею мудреца» — новеллу о греческих философах, примерно на час. Здесь можно попробовать её без оценки.</p>' +
    '<button class="btn" data-act="vn">Попробовать зачёт</button></div>';
  if (!net.cl) return '<div class="card"><p class="kick">Зачёт</p><p class="small" style="margin:0">Когда все добегут, преподаватель закроет забег. Трое первых освобождаются от зачёта, остальные отправятся в путь. Страницу не закрывайте.</p></div>';
  if (amExempt()) {
    var k = 0; net.cl.forEach(function (r, i) { if (r[0] === S.id) k = i + 1; });
    return '<div class="card" style="text-align:center"><div class="wreath">🌿</div><p class="kick">' + k + '-е место</p><h2 style="margin:4px 0">Освобождены от зачёта</h2>' +
      '<p class="small">Лавровый венок ваш. Зачёт ставится автоматически по итогам забега.</p></div>';
  }
  return '<div class="card"><p class="kick">Зачёт · Одиссея мудреца</p><p class="small" style="margin:0">Забег закрыт. Впереди путь через семь полисов: Дельфы, Элея, Мегара, Коринф, Милет, Абдеры, Афины. Вы будете говорить с Диогеном, Протагором, Сократом и другими. ' +
    'Зачёт зависит от ваших ответов в пути. Займёт около часа, прогресс сохраняется на телефоне. Включите звук.</p>' +
    '<button class="btn" data-act="vn">Отправиться в путь →</button></div>';
}
function renderVNStart() {
  stopGame();
  app.innerHTML = '<div class="screen"><div class="hero" style="height:220px"><canvas id="heroCv"></canvas><div class="hero-t"><h1>Одиссея<br>мудреца</h1><p>Зачёт по логике в форме визуальной новеллы.</p></div></div>' +
    '<div class="meander"></div><main class="wrap"><div class="card"><p class="kick">Путник</p>' +
    '<label class="field"><span>Фамилия</span><input id="fSur" autocomplete="off" value="' + esc(draft.sur) + '"></label>' +
    '<label class="field"><span>Имя</span><input id="fName" autocomplete="off" value="' + esc(draft.name) + '"></label>' +
    '<label class="field"><span>Группа</span><input id="fGroup" autocomplete="off" value="' + esc(draft.group) + '"></label>' +
    '<p class="err">' + esc(draft.err) + '</p><button class="btn" data-act="vnstart">Отправиться в путь →</button>' +
    (QP.vn === "1" ? '' : '<button class="btn sec" data-act="back">← К забегу</button>') + '</div></main></div>';
  [["fSur", "sur"], ["fName", "name"], ["fGroup", "group"]].forEach(function (p) {
    var el = document.getElementById(p[0]); el.addEventListener("input", function () { draft[p[1]] = el.value; });
  });
  heroScene();
}
document.addEventListener("visibilitychange", function () {
  if (document.hidden && V && !V.ended && document.getElementById("vn")) { V.lv = (V.lv || 0) + 1; vSave(); }
});

/* ---------- действия ---------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  var act = el.dataset.act;
  if (act === "toLook") {
    if (!draft.sur.trim() || !draft.name.trim()) { draft.err = "Введите фамилию и имя."; return renderStart(); }
    if (!draft.group.trim()) { draft.err = "Укажите группу."; return renderStart(); }
    draft.err = ""; draft.step = "look"; render(); window.scrollTo(0, 0);
  }
  else if (act === "back") { draft.step = "start"; render(); }
  else if (act === "head" || act === "col") {
    draft[act === "head" ? "h" : "c"] = +el.dataset.k;
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="' + act + '"]'), function (b) { b.setAttribute("aria-pressed", b === el); });
    if (lookRace) { var p = lookRace.players.me; p.look = lookKey(draft.h, draft.c); }
  }
  else if (act === "go") { S = fresh(); save(); stopGame(); render(); }
  else if (act === "ans") answer(+el.dataset.o);
  else if (act === "use") useItem();
  else if (act === "train") { location.search = "?demo=1" + (QP.zabeg ? "&zabeg=" + encodeURIComponent(QP.zabeg) : ""); }
  else if (act === "real") { location.search = QP.zabeg ? "?zabeg=" + encodeURIComponent(QP.zabeg) : ""; }
  else if (act === "unlock") {
    var v = (document.getElementById("pw") || {}).value || "";
    if (hashStr(v.trim().toLowerCase()) === PASS_HASH) { S.revealed = true; ui.pwErr = ""; save(); } else ui.pwErr = "Неверный пароль.";
    renderQuiz();
  }
  else if (act === "reset") { ui.reset = true; renderQuiz(); }
  else if (act === "noreset") { ui.reset = false; renderQuiz(); }
  else if (act === "reset2") { S = null; ui.reset = false; save(); stopGame(); draft.step = "start"; render(); }
  else if (act === "vn") { startVN(vnWho()); }
  else if (act === "vnstart") {
    if (!draft.sur.trim() || !draft.name.trim()) { draft.err = "Введите фамилию и имя."; return renderVNStart(); }
    if (!draft.group.trim()) { draft.err = "Укажите группу."; return renderVNStart(); }
    startVN(vnWho());
  }
  else if (act === "vmute") { setMute(!vn.mute); }
  else if (act === "vlog") { openLog(); }
  else if (act === "vlogclose") { var lg = document.getElementById("vLog"); if (lg) lg.className = "vlog"; }
  else if (act === "vback") { renderVN(); }
  else if (act === "vsend") { V.sent = false; vnSend(); }
  else if (act === "vagain") {
    if (!DEMO) { var pw2 = window.prompt("Пересдача — с разрешения преподавателя. Пароль:"); if (pw2 === null) return; if (hashStr(pw2.trim().toLowerCase()) !== PASS_HASH) return; }
    var who = { name: V.name, surname: V.surname, first: V.first, group: V.group, room: V.room, look: V.look }, tries = (V.tries || 1) + 1;
    V = vFresh(who); V.tries = tries; vSave(); vn.Q = []; renderVN();
  }
  else if (act === "vexit") { stopAmb(); clearInterval(vn.music); vn.music = null; V = null; document.body.classList.remove("bare"); render(); }
  else if (act === "close") {
    var cp = (document.getElementById("cPw") || {}).value || "";
    if (hashStr(cp.trim().toLowerCase()) !== PASS_HASH) { alertNote("Неверный пароль"); return; }
    api({ a: "close", room: (QP.zabeg || "").toUpperCase(), k: PASS_HASH }, function (j) { if (j && j.ok) showPodium(j.cl || []); else alertNote("Не удалось закрыть забег"); });
  }
  else if (act === "proj") { var r = (document.getElementById("pRoom") || {}).value || ""; if (r.trim()) location.search = "?screen=1&zabeg=" + encodeURIComponent(r.trim()); }
});
setInterval(function () { var c = document.getElementById("clock"); if (c && S && !S.done) c.textContent = minutes() + "′"; }, 15000);

if (DEMO) startBots();
loadImages(function () { render(); });
gInit();
</script>
</body></html>
